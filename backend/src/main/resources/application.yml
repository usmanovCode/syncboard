spring:
  application:
    name: syncboard
  config:
    # Local secrets live in backend/.env (git-ignored); see .env.example.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/syncboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT1H}
    issuer: syncboard
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
